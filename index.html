<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leon & Nadine's Chore Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #f0f4ff;
      --card: #ffffff;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --text: #1e293b;
      --muted: #64748b;
      --leon: #3b82f6;
      --nadine: #ec4899;
      --shadow: 0 4px 14px rgba(99, 102, 241, 0.12);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #fce7f3 50%, #fef3c7 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    header {
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      color: white;
      padding: 1.75rem 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
      animation: shine 8s linear infinite;
    }

    @keyframes shine {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 0.35rem;
      position: relative;
    }

    header p {
      opacity: 0.95;
      font-size: 1rem;
      position: relative;
    }

    .header-icons {
      font-size: 1.6rem;
      margin-top: 0.5rem;
      letter-spacing: 0.4rem;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.2);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      margin-top: 0.6rem;
      position: relative;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 1rem;
      text-align: center;
      box-shadow: var(--shadow);
      border: 2px solid transparent;
      transition: transform 0.2s;
    }

    .stat-card:hover { transform: translateY(-3px); }
    .stat-card.leon { border-color: var(--leon); }
    .stat-card.nadine { border-color: var(--nadine); }
    .stat-card.total { border-color: var(--primary); }
    .stat-card.progress { border-color: var(--success); }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      display: block;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
      justify-content: space-between;
    }

    .filter-select {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      background: var(--card);
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      box-shadow: var(--shadow);
    }

    .filter-select label {
      font-weight: 600;
      font-size: 0.85rem;
      margin-right: 0.25rem;
    }

    .filter-btn {
      border: none;
      background: #e2e8f0;
      color: var(--text);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .filter-btn.active-all { background: var(--primary); color: white; }
    .filter-btn.active-leon { background: var(--leon); color: white; }
    .filter-btn.active-nadine { background: var(--nadine); color: white; }

    .btn {
      border: none;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); transform: scale(1.03); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-outline {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-warning {
      background: #f59e0b;
      color: white;
    }
    .btn-warning:hover { background: #d97706; }

    .section {
      background: var(--card);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-header {
      padding: 1rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .section-header h2 {
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .section-body {
      padding: 1rem;
    }

    .chore-list {
      display: grid;
      gap: 0.6rem;
    }

    .chore-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.75rem;
      align-items: center;
      background: #f8fafc;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .chore-item:hover {
      border-color: #c7d2fe;
      background: #eef2ff;
    }

    .chore-item.done {
      background: #ecfdf5;
      border-color: #a7f3d0;
      opacity: 0.9;
    }

    .chore-item.done .chore-name {
      text-decoration: line-through;
      color: var(--muted);
    }

    .chore-item.hidden { display: none; }

    .check-wrap {
      position: relative;
      width: 28px;
      height: 28px;
    }

    .check-wrap input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 2;
    }

    .checkmark {
      position: absolute;
      top: 0; left: 0;
      width: 28px; height: 28px;
      background: white;
      border: 2.5px solid #cbd5e1;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .check-wrap input:checked + .checkmark {
      background: var(--success);
      border-color: var(--success);
    }

    .checkmark::after {
      content: '';
      position: absolute;
      display: none;
      left: 8px; top: 3px;
      width: 7px; height: 13px;
      border: solid white;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    .check-wrap input:checked + .checkmark::after { display: block; }

    .chore-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .chore-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .freq-tag {
      font-size: 0.7rem;
      background: #e0e7ff;
      color: #4338ca;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-weight: 600;
      margin-left: 0.4rem;
    }

    .assignee-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      color: white;
      min-width: 70px;
      text-align: center;
    }

    .assignee-badge.leon { background: var(--leon); }
    .assignee-badge.nadine { background: var(--nadine); }

    .info-banner {
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
      border: 2px solid #a5b4fc;
      border-radius: 14px;
      padding: 0.9rem 1.2rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .info-banner.warning {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-color: #f59e0b;
    }

    .info-banner strong { color: var(--primary-dark); }

    .empty-state {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      opacity: 0;
      transition: all 0.35s ease;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: white;
      border-radius: 20px;
      padding: 1.75rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      transform: scale(0.9);
      transition: transform 0.25s;
    }

    .modal-overlay.open .modal { transform: scale(1); }

    .modal h3 {
      margin-bottom: 0.5rem;
      font-size: 1.25rem;
    }

    .modal p {
      color: var(--muted);
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.45rem; }
      .chore-item {
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto;
      }
      .assignee-badge {
        grid-column: 1 / -1;
        justify-self: end;
        margin-top: 0.25rem;
      }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .section-header { flex-direction: column; align-items: flex-start; }
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 150;
      overflow: hidden;
    }
  </style>
</head>
<body>

      <h1>🏠 Leon & Nadine's Chore Tracker</h1>
      <p>Daily chores stay stable · Weekly extras get a fresh fair split</p>
      <div class="header-icons">🧹 ✨ 🧺 🧽 🛏️</div>
      <div class="sync-status">
        <span class="sync-dot"></span>
        <span>Live sync active</span>
      </div>
    </header>

    <div class="info-banner">
      <span style="font-size:1.3rem;">🔄</span>
      <div>
        <strong>Real-time sync is on</strong><br>
        When one of you ticks a chore, the other person will see it within a second.
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="controls">
      <div class="filter-select">
        <label>Show:</label>
        <button class="filter-btn active-all" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Leon">Leon 💙</button>
        <button class="filter-btn" data-filter="Nadine">Nadine 💖</button>
      </div>
    </div>

    <div class="section">
