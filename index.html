<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leon & Nadine's Chore Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --text: #1e293b;
      --muted: #64748b;
      --leon: #3b82f6;
      --nadine: #ec4899;
      --card: #ffffff;
      --radius: 16px;
      --shadow: 0 4px 14px rgba(99, 102, 241, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #e0e7ff 0%, #fce7f3 50%, #fef3c7 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      padding-bottom: 2rem;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 0.75rem;
    }
    header {
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      color: white;
      padding: 1.25rem 1rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }
    header p {
      font-size: 0.85rem;
      opacity: 0.95;
    }
    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255,255,255,0.22);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .stats-freq {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 480px) {
      .stats-freq { grid-template-columns: 1fr 1fr; }
    }
    .stat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 0.7rem 0.4rem;
      text-align: center;
      box-shadow: var(--shadow);
      border: 2px solid transparent;
    }
    .stat-card.leon { border-color: var(--leon); }
    .stat-card.nadine { border-color: var(--nadine); }
    .stat-card.total { border-color: var(--primary); }
    .stat-card.progress { border-color: var(--success); }
    .stat-card.daily { border-color: #f59e0b; }
    .stat-card.weekly { border-color: #3b82f6; }
    .stat-card.biweekly { border-color: #8b5cf6; }
    .stat-card.monthly { border-color: #10b981; }
    .stat-card.bimonthly { border-color: #ec4899; }
    .stat-value {
      font-size: 1.25rem;
      font-weight: 800;
      display: block;
    }
    .stat-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .filter-bar {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1rem;
      background: var(--card);
      padding: 0.4rem;
      border-radius: 999px;
      box-shadow: var(--shadow);
    }
    .filter-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 0.55rem 0.4rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .filter-btn.active-all { background: var(--primary); color: white; }
    .filter-btn.active-leon { background: var(--leon); color: white; }
    .filter-btn.active-nadine { background: var(--nadine); color: white; }
    .section {
      background: var(--card);
      border-radius: var(--radius);
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .section-header {
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      border-bottom: 1px solid #e2e8f0;
    }
    .section-header h2 {
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .section-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .btn {
      border: none;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-warning { background: #f59e0b; color: white; }
    .section-body { padding: 0.75rem; }
    .info-banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      margin-bottom: 0.75rem;
      font-size: 0.8rem;
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }
    .chore-list {
      display: grid;
      gap: 0.5rem;
    }
    .chore-item {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 0.6rem;
      align-items: center;
      background: #f8fafc;
      border-radius: 14px;
      padding: 0.85rem 0.75rem;
      border: 2px solid transparent;
      min-height: 64px;
    }
    .chore-item.done {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }
    .chore-item.done .chore-name {
      text-decoration: line-through;
      color: var(--muted);
    }
    .chore-item.hidden { display: none; }
    .check-wrap {
      position: relative;
      width: 36px;
      height: 36px;
    }
    .check-wrap input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 2;
    }
    .checkmark {
      position: absolute;
      top: 0; left: 0;
      width: 36px; height: 36px;
      background: white;
      border: 3px solid #cbd5e1;
      border-radius: 10px;
    }
    .check-wrap input:checked + .checkmark {
      background: var(--success);
      border-color: var(--success);
    }
    .checkmark::after {
      content: '';
      position: absolute;
      display: none;
      left: 11px; top: 5px;
      width: 9px; height: 16px;
      border: solid white;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }
    .check-wrap input:checked + .checkmark::after { display: block; }
    .chore-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .chore-name {
      font-weight: 600;
      font-size: 0.92rem;
      line-height: 1.3;
    }
    .chore-bottom {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .assignee-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      color: white;
    }
    .assignee-badge.leon { background: var(--leon); }
    .assignee-badge.nadine { background: var(--nadine); }
    .freq-tag {
      font-size: 0.65rem;
      background: #e0e7ff;
      color: #4338ca;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .chore-meta {
      font-size: 0.7rem;
      color: var(--muted);
    }
    footer {
      text-align: center;
      padding: 1.25rem 0.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: #1e293b;
      color: white;
      padding: 0.8rem 1.4rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 1.5rem 1.25rem 2rem;
      width: 100%;
      max-width: 480px;
      text-align: center;
      transform: translateY(100%);
      transition: transform 0.3s;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal h3 {
      margin-bottom: 0.4rem;
      font-size: 1.2rem;
    }
    .modal p {
      color: var(--muted);
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
    }
    .modal-actions {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
    }
    .modal-actions .btn {
      flex: 1;
      padding: 0.75rem;
      font-size: 0.95rem;
    }
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 150;
      overflow: hidden;
    }
    .loading {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏠 Leon & Nadine's Chores</h1>
      <p>Fair split · Live sync</p>
      <div class="sync-status">
        <span class="sync-dot"></span>
        <span id="syncText">Connecting...</span>
      </div>
    </header>
    <div class="stats" id="stats">
      <div class="stat-card total"><span class="stat-value">-</span><span class="stat-label">Completed</span></div>
      <div class="stat-card progress"><span class="stat-value">-</span><span class="stat-label">Progress</span></div>
      <div class="stat-card leon"><span class="stat-value">-</span><span class="stat-label">Leon 💙</span></div>
      <div class="stat-card nadine"><span class="stat-value">-</span><span class="stat-label">Nadine 💖</span></div>
    </div>
    <div class="stats-freq" id="statsFreq">
      <div class="stat-card daily"><span class="stat-value">-</span><span class="stat-label">☀️ Daily</span></div>
      <div class="stat-card weekly"><span class="stat-value">-</span><span class="stat-label">📅 Weekly</span></div>
      <div class="stat-card biweekly"><span class="stat-value">-</span><span class="stat-label">🗓️ 2 Weeks</span></div>
      <div class="stat-card monthly"><span class="stat-value">-</span><span class="stat-label">🌙 Monthly</span></div>
      <div class="stat-card bimonthly"><span class="stat-value">-</span><span class="stat-label">🌙 2 Months</span></div>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active-all" data-filter="all">All</button>
      <button class="filter-btn" data-filter="Leon">Leon 💙</button>
      <button class="filter-btn" data-filter="Nadine">Nadine 💖</button>
    </div>
    <div id="content">
      <div class="loading">Loading chores...</div>
    </div>
    <footer>Live sync powered by Firebase</footer>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modalTitle">Confirm</h3>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>
  <div id="confetti"></div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDlQY0DVO9b47Rndr0de0kyykIDq4TdLBQ",
      authDomain: "chore-tracker-a3921.firebaseapp.com",
      projectId: "chore-tracker-a3921",
      storageBucket: "chore-tracker-a3921.firebasestorage.app",
      messagingSenderId: "630623368659",
      appId: "1:630623368659:web:e75d1898979d03e509eb26",
      databaseURL: "https://chore-tracker-a3921-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const stateRef = db.ref('choreState');
    const DAILY_CHORES = [
      { id: 'd1', name: 'Prepare dinner & clean stove / air fryer', emoji: '🍳' },
      { id: 'd2', name: 'Throw out recycling', emoji: '♻️' },
      { id: 'd3', name: 'Collect all soda cans', emoji: '🥤' },
      { id: 'd4', name: 'Pack dishwasher & do leftover dishes (evening)', emoji: '🍽️' },
      { id: 'd5', name: 'Unpack dishwasher & put everything away', emoji: '🍴' },
      { id: 'd6', name: 'Pick up and put away toys', emoji: '🧸' },
      { id: 'd7', name: 'Pick up random stuff not in place', emoji: '🧹' },
      { id: 'd8', name: 'Wipe/mop spills and spots on floors', emoji: '🧽' },
      { id: 'd9', name: 'Wipe down kitchen counter tops', emoji: '✨' },
      { id: 'd10', name: 'Make bed', emoji: '🛏️' },
      { id: 'd11', name: 'Throw all trash in bag', emoji: '🗑️' },
      { id: 'd12', name: 'Food prep for next day (evening)', emoji: '🥗' }
    ];
    const WEEKLY_POOL = [
      { id: 't1', name: 'Laundry (Wed & Sun)', emoji: '🧺', freq: 'Twice a week' },
      { id: 'w1', name: 'Empty & blow out vacuum', emoji: '💨', freq: 'Once a week' },
      { id: 'w2', name: 'Vacuum living room + spray freshener', emoji: '🧹', freq: 'Once a week' },
      { id: 'w3', name: 'Wipe down all surface tops', emoji: '🧴', freq: 'Once a week' },
      { id: 'w4', name: 'Mop floors', emoji: '🧼', freq: 'Once a week' },
      { id: 'w5', name: 'Put robot downstairs', emoji: '🤖', freq: 'Once a week' },
      { id: 'w6', name: 'Clean microwave', emoji: '📡', freq: 'Once a week' },
      { id: 'w7', name: 'Bleach kitchen towels', emoji: '🧺', freq: 'Once a week' },
      { id: 'w8', name: 'Clean bathroom & toilet', emoji: '🚽', freq: 'Once a week' },
      { id: 'w9', name: 'Replenish bathroom supplies', emoji: '🧻', freq: 'Once a week' },
      { id: 'w10', name: 'Dust all flat surfaces', emoji: '🪶', freq: 'Once a week' },
      { id: 'w11', name: 'Declutter / organize rooms', emoji: '📦', freq: 'Once a week' },
      { id: 'b1', name: 'Put out recycling (Thursday)', emoji: '♻️', freq: 'Every 2 weeks' },
      { id: 'b2', name: 'Water plants', emoji: '🪴', freq: 'Every 2 weeks' },
      { id: 'b3', name: 'Check & clean play room', emoji: '🎮', freq: 'Every 2 weeks' },
      { id: 'b4', name: 'Clean top of ceiling fans', emoji: '💨', freq: 'Every 2 weeks' }
    ];
    const LONGTERM_CHORES = [
      { id: 'm1', name: 'Check salt in water softener', emoji: '🧂', freq: 'Once a month' },
      { id: 'm2', name: 'Clean window sills', emoji: '🪟', freq: 'Once a month' },
      { id: 'm3', name: 'Clean fridge', emoji: '🧊', freq: 'Once a month' },
      { id: 'bm1', name: 'Wash bedding', emoji: '🛌', freq: 'Every 2 months' },
      { id: 'bm2', name: 'Check outdoor lint buildup', emoji: '🏠', freq: 'Every 2 months' }
    ];
    let currentFilter = 'all';
    let state = null;
    let isReady = false;
    function createFairAssignments(list) {
      const a = {};
      list.forEach((ch, i) => a[ch.id] = (i % 2 === 0) ? 'Leon' : 'Nadine');
      return a;
    }
    function flipAssignments(obj) {
      const n = {};
      Object.keys(obj).forEach(k => n[k] = obj[k] === 'Leon' ? 'Nadine' : 'Leon');
      return n;
    }
    function getDefaultState() {
      return {
        dailyAssignments: createFairAssignments(DAILY_CHORES),
        weeklyAssignments: createFairAssignments(WEEKLY_POOL),
        longtermAssignments: createFairAssignments(LONGTERM_CHORES),
        completions: {}
      };
    }
    function saveState() {
      if (!isReady) return;
      stateRef.set(state);
    }
    stateRef.on('value', (snap) => {
      const data = snap.val();
      if (data && data.dailyAssignments) {
        state = data;
        // Ensure required objects always exist (old data may be missing them)
        if (!state.completions) state.completions = {};
        if (!state.dailyAssignments) state.dailyAssignments = createFairAssignments(DAILY_CHORES);
        if (!state.weeklyAssignments) state.weeklyAssignments = createFairAssignments(WEEKLY_POOL);
        if (!state.longtermAssignments) state.longtermAssignments = createFairAssignments(LONGTERM_CHORES);
      } else {
        state = getDefaultState();
        stateRef.set(state);
      }
      isReady = true;
      document.getElementById('syncText').textContent = 'Live sync active';
      render();
    }, (err) => {
      document.getElementById('syncText').textContent = 'Connection error';
      console.error(err);
    });
    function render() {
      if (!state) return;
      renderStats();
      renderAll();
    }
    function renderStats() {
      // Group chores by frequency
      const weeklyChores = WEEKLY_POOL.filter(ch => ch.freq === 'Once a week' || ch.freq === 'Twice a week');
      const biweeklyChores = WEEKLY_POOL.filter(ch => ch.freq === 'Every 2 weeks');
      const monthlyChores = LONGTERM_CHORES.filter(ch => ch.freq === 'Once a month');
      const bimonthlyChores = LONGTERM_CHORES.filter(ch => ch.freq === 'Every 2 months');

      const countDone = (list) => list.filter(ch => state.completions?.[ch.id]?.done).length;

      const dailyDone = countDone(DAILY_CHORES);
      const weeklyDone = countDone(weeklyChores);
      const biweeklyDone = countDone(biweeklyChores);
      const monthlyDone = countDone(monthlyChores);
      const bimonthlyDone = countDone(bimonthlyChores);

      const total = DAILY_CHORES.length + WEEKLY_POOL.length + LONGTERM_CHORES.length;
      const done = dailyDone + weeklyDone + biweeklyDone + monthlyDone + bimonthlyDone;

      let leonDone = 0, nadineDone = 0;
      const countPerson = (list, assigns) => {
        list.forEach(ch => {
          if (state.completions?.[ch.id]?.done) {
            if ((assigns[ch.id] || 'Leon') === 'Leon') leonDone++;
            else nadineDone++;
          }
        });
      };
      countPerson(DAILY_CHORES, state.dailyAssignments || {});
      countPerson(WEEKLY_POOL, state.weeklyAssignments || {});
      countPerson(LONGTERM_CHORES, state.longtermAssignments || {});

      const pct = total ? Math.round((done / total) * 100) : 0;
      const pctOf = (d, t) => t ? Math.round((d / t) * 100) : 0;

      document.getElementById('stats').innerHTML = `
        <div class="stat-card total"><span class="stat-value">${done}/${total}</span><span class="stat-label">Completed</span></div>
        <div class="stat-card progress"><span class="stat-value">${pct}%</span><span class="stat-label">Overall</span></div>
        <div class="stat-card leon"><span class="stat-value">${leonDone}</span><span class="stat-label">Leon 💙</span></div>
        <div class="stat-card nadine"><span class="stat-value">${nadineDone}</span><span class="stat-label">Nadine 💖</span></div>
      `;

      document.getElementById('statsFreq').innerHTML = `
        <div class="stat-card daily">
          <span class="stat-value">${dailyDone}/${DAILY_CHORES.length}</span>
          <span class="stat-label">☀️ Daily · ${pctOf(dailyDone, DAILY_CHORES.length)}%</span>
        </div>
        <div class="stat-card weekly">
          <span class="stat-value">${weeklyDone}/${weeklyChores.length}</span>
          <span class="stat-label">📅 Weekly · ${pctOf(weeklyDone, weeklyChores.length)}%</span>
        </div>
        <div class="stat-card biweekly">
          <span class="stat-value">${biweeklyDone}/${biweeklyChores.length}</span>
          <span class="stat-label">🗓️ 2 Weeks · ${pctOf(biweeklyDone, biweeklyChores.length)}%</span>
        </div>
        <div class="stat-card monthly">
          <span class="stat-value">${monthlyDone}/${monthlyChores.length}</span>
          <span class="stat-label">🌙 Monthly · ${pctOf(monthlyDone, monthlyChores.length)}%</span>
        </div>
        <div class="stat-card bimonthly">
          <span class="stat-value">${bimonthlyDone}/${bimonthlyChores.length}</span>
          <span class="stat-label">🌙 2 Months · ${pctOf(bimonthlyDone, bimonthlyChores.length)}%</span>
        </div>
      `;
    }
    function renderChore(ch, assigns) {
      const c = state.completions?.[ch.id] || {};
      const done = !!c.done;
      const who = assigns[ch.id] || 'Leon';
      const hidden = (currentFilter !== 'all' && who !== currentFilter) ? 'hidden' : '';
      const dateStr = c.date ? new Date(c.date).toLocaleDateString(undefined, {month:'short', day:'numeric'}) : '';
      return `
        <div class="chore-item ${done ? 'done' : ''} ${hidden}">
          <div class="check-wrap">
            <input type="checkbox" ${done ? 'checked' : ''} onchange="toggleDone('${ch.id}', this.checked)">
            <span class="checkmark"></span>
          </div>
          <div class="chore-content">
            <div class="chore-name">${ch.emoji} ${ch.name}</div>
            <div class="chore-bottom">
              <span class="assignee-badge ${who.toLowerCase()}">${who}</span>
              ${ch.freq ? `<span class="freq-tag">${ch.freq}</span>` : ''}
              ${done && dateStr ? `<span class="chore-meta">${dateStr}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }
    function renderAll() {
      const html = `
        <div class="section">
          <div class="section-header">
            <h2>☀️ Every Day</h2>
            <div class="section-actions">
              <button class="btn btn-outline" onclick="rebalance('daily')">🔀 Re-balance</button>
              <button class="btn btn-danger" onclick="clearChecks('daily')">🔄 Clear</button>
            </div>
          </div>
          <div class="section-body">
            <div class="chore-list">
              ${DAILY_CHORES.map(ch => renderChore(ch, state.dailyAssignments || {})).join('')}
            </div>
          </div>
        </div>
        <div class="section">
          <div class="section-header">
            <h2>📅 This Week’s Extras</h2>
            <div class="section-actions">
              <button class="btn btn-warning" onclick="rebalance('weekly')">🔀 Re-balance</button>
              <button class="btn btn-danger" onclick="clearChecks('weekly')">🔄 Clear</button>
            </div>
          </div>
          <div class="section-body">
            <div class="info-banner">
              <span>💡</span>
              <div>Press <strong>Re-balance</strong> for a fresh fair split of these chores.</div>
            </div>
            <div class="chore-list">
              ${WEEKLY_POOL.map(ch => renderChore(ch, state.weeklyAssignments || {})).join('')}
            </div>
          </div>
        </div>
        <div class="section">
          <div class="section-header">
            <h2>🌙 Longer-Term</h2>
            <div class="section-actions">
              <button class="btn btn-outline" onclick="rebalance('longterm')">🔀 Re-balance</button>
            </div>
          </div>
          <div class="section-body">
            <div class="chore-list">
              ${LONGTERM_CHORES.map(ch => renderChore(ch, state.longtermAssignments || {})).join('')}
            </div>
          </div>
        </div>
      `;
      document.getElementById('content').innerHTML = html;
    }
    function toggleDone(id, checked) {
      if (!state.completions) state.completions = {};
      if (!state.completions[id]) state.completions[id] = {};
      state.completions[id].done = checked;
      state.completions[id].date = checked ? new Date().toISOString() : null;
      saveState();
      if (checked) {
        showToast('Done! ✅');
        spawnConfetti();
      }
    }
    function rebalance(type) {
      showModal('Re-balance chores?', 'This will create a new fair 50/50 split.', 'Yes, Re-balance', () => {
        if (type === 'daily') {
          state.dailyAssignments = createFairAssignments(DAILY_CHORES);
          if (Math.random() > 0.5) state.dailyAssignments = flipAssignments(state.dailyAssignments);
        } else if (type === 'weekly') {
          state.weeklyAssignments = createFairAssignments(WEEKLY_POOL);
          if (Math.random() > 0.5) state.weeklyAssignments = flipAssignments(state.weeklyAssignments);
        } else {
          state.longtermAssignments = createFairAssignments(LONGTERM_CHORES);
          if (Math.random() > 0.5) state.longtermAssignments = flipAssignments(state.longtermAssignments);
        }
        saveState();
        showToast('Re-balanced! ⚖️');
      });
    }
    function clearChecks(type) {
      showModal('Clear checkmarks?', 'This only clears the ticks, not the assignments.', 'Yes, Clear', () => {
        if (!state.completions) state.completions = {};
        const list = type === 'daily' ? DAILY_CHORES : WEEKLY_POOL;
        list.forEach(ch => {
          if (state.completions[ch.id]) {
            state.completions[ch.id].done = false;
            state.completions[ch.id].date = null;
          }
        });
        saveState();
        showToast('Cleared');
      });
    }
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('active-all', 'active-leon', 'active-nadine');
        });
        if (currentFilter === 'all') btn.classList.add('active-all');
        else if (currentFilter === 'Leon') btn.classList.add('active-leon');
        else btn.classList.add('active-nadine');
        render();
      });
    });
    let modalCb = null;
    function showModal(title, text, label, cb) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalText').textContent = text;
      document.getElementById('modalConfirm').textContent = label;
      document.getElementById('modalConfirm').className = 'btn ' + (label.includes('Clear') ? 'btn-danger' : 'btn-primary');
      modalCb = cb;
      document.getElementById('modal').classList.add('open');
    }
    document.getElementById('modalCancel').onclick = () => {
      document.getElementById('modal').classList.remove('open');
      modalCb = null;
    };
    document.getElementById('modalConfirm').onclick = () => {
      if (modalCb) modalCb();
      document.getElementById('modal').classList.remove('open');
      modalCb = null;
    };
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }
    function spawnConfetti() {
      const box = document.getElementById('confetti');
      const colors = ['#6366f1','#ec4899','#f59e0b','#10b981','#3b82f6'];
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.style.cssText = `position:absolute;width:8px;height:8px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*100}%;top:-10px;border-radius:${Math.random()>0.5?'50%':'2px'};animation:fall ${1.2+Math.random()}s linear forwards;`;
        box.appendChild(p);
        setTimeout(() => p.remove(), 2200);
      }
    }
    const s = document.createElement('style');
    s.textContent = `@keyframes fall{to{transform:translateY(100vh) rotate(360deg);opacity:0}}`;
    document.head.appendChild(s);
  </script>
</body>
</html>
