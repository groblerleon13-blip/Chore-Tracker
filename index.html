<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leon & Nadine's Chore Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --text: #1e293b;
      --muted: #64748b;
      --leon: #3b82f6;
      --nadine: #ec4899;
      --card: #ffffff;
      --radius: 16px;
      --shadow: 0 4px 14px rgba(99, 102, 241, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #e0e7ff 0%, #fce7f3 50%, #fef3c7 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      padding-bottom: 2rem;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 0.75rem;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      color: white;
      padding: 1.25rem 1rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
      text-align: center;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.95;
    }

    .sync-status {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(255,255,255,0.22);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 0.85rem 0.5rem;
      text-align: center;
      box-shadow: var(--shadow);
      border: 2px solid transparent;
    }

    .stat-card.leon { border-color: var(--leon); }
    .stat-card.nadine { border-color: var(--nadine); }
    .stat-card.total { border-color: var(--primary); }
    .stat-card.progress { border-color: var(--success); }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 800;
      display: block;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* Filter */
    .filter-bar {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1rem;
      background: var(--card);
      padding: 0.4rem;
      border-radius: 999px;
      box-shadow: var(--shadow);
    }

    .filter-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 0.55rem 0.4rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .filter-btn.active-all { background: var(--primary); color: white; }
    .filter-btn.active-leon { background: var(--leon); color: white; }
    .filter-btn.active-nadine { background: var(--nadine); color: white; }

    /* Sections */
    .section {
      background: var(--card);
      border-radius: var(--radius);
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-header {
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      border-bottom: 1px solid #e2e8f0;
    }

    .section-header h2 {
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .section-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .btn {
      border: none;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-warning { background: #f59e0b; color: white; }

    .section-body { padding: 0.75rem; }

    .info-banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      margin-bottom: 0.75rem;
      font-size: 0.8rem;
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }

    /* Chore items - mobile optimized */
    .chore-list {
      display: grid;
      gap: 0.5rem;
    }

    .chore-item {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 0.6rem;
      align-items: center;
      background: #f8fafc;
      border-radius: 14px;
      padding: 0.85rem 0.75rem;
      border: 2px solid transparent;
      min-height: 64px;
    }

    .chore-item.done {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .chore-item.done .chore-name {
      text-decoration: line-through;
      color: var(--muted);
    }

    .chore-item.hidden { display: none; }

    /* Bigger checkbox for phones */
    .check-wrap {
      position: relative;
      width: 36px;
      height: 36px;
    }

    .check-wrap input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 2;
    }

    .checkmark {
      position: absolute;
      top: 0; left: 0;
      width: 36px; height: 36px;
      background: white;
      border: 3px solid #cbd5e1;
      border-radius: 10px;
    }

    .check-wrap input:checked + .checkmark {
      background: var(--success);
      border-color: var(--success);
    }

    .checkmark::after {
      content: '';
      position: absolute;
      display: none;
      left: 11px; top: 5px;
      width: 9px; height: 16px;
      border: solid white;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    .check-wrap input:checked + .checkmark::after { display: block; }

    .chore-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .chore-name {
      font-weight: 600;
      font-size: 0.92rem;
      line-height: 1.3;
    }

    .chore-bottom {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .assignee-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      color: white;
    }

    .assignee-badge.leon { background: var(--leon); }
    .assignee-badge.nadine { background: var(--nadine); }

    .freq-tag {
      font-size: 0.65rem;
      background: #e0e7ff;
      color: #4338ca;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
      font-weight: 600;
    }

    .chore-meta {
      font-size: 0.7rem;
      color: var(--muted);
    }

    footer {
      text-align: center;
      padding: 1.25rem 0.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: #1e293b;
      color: white;
      padding: 0.8rem 1.4rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 1.5rem 1.25rem 2rem;
      width: 100%;
      max-width: 480px;
      text-align: center;
      transform: translateY(100%);
      transition: transform 0.3s;
    }

    .modal-overlay.open .modal { transform: translateY(0); }

    .modal h3 {
      margin-bottom: 0.4rem;
      font-size: 1.2rem;
    }

    .modal p {
      color: var(--muted);
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
    }

    .modal-actions .btn {
      flex: 1;
      padding: 0.75rem;
      font-size: 0.95rem;
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 150;
      overflow: hidden;
    }

    .loading {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>

    </div>
  </div>

  <div id="confetti"></div>
